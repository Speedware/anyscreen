name: anyscreen

services:
  anyscreen:
    build: .
    image: anyscreen:latest
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - anyscreen_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - anyscreen
    restart: unless-stopped

volumes:
  anyscreen_data:
  caddy_data:
  caddy_config:
