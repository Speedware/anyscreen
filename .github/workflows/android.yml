name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: gradle assembleDebug

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: anyscreen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANYSCREEN_KEYSTORE_BASE64 != '' }}
        env:
          ANYSCREEN_KEYSTORE_BASE64: ${{ secrets.ANYSCREEN_KEYSTORE_BASE64 }}
        run: echo "$ANYSCREEN_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"

      - name: Build release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          ANYSCREEN_KEYSTORE_PATH: ${{ secrets.ANYSCREEN_KEYSTORE_BASE64 != '' && format('{0}/android/release.keystore', github.workspace) || '' }}
          ANYSCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANYSCREEN_KEYSTORE_PASSWORD }}
          ANYSCREEN_KEY_ALIAS: ${{ secrets.ANYSCREEN_KEY_ALIAS }}
          ANYSCREEN_KEY_PASSWORD: ${{ secrets.ANYSCREEN_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Attach release APK to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
